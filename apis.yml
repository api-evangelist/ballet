name: Ballet
description: 'Ballet is a consumer cryptocurrency cold-storage company founded by Bobby Lee that
  makes physical, non-electronic wallet cards based on the BIP38 open-source standard, letting
  people store Bitcoin, Ethereum, XRP and 1,000+ coins and NFTs safe from electronic hacking and
  preventable user error. The physical REAL Series card holds the keys; a companion mobile app,
  Ballet Crypto, lets holders check balances and market value and add assets. Backed by Ribbit
  Capital, Ballet is a hardware/consumer product rather than a developer platform, so it publishes
  no public API — this profile captures its identity, security posture, and open-source footprint.'
